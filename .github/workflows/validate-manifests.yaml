name: Validate Manifests

on:
  pull_request:
    paths:
      - 'manifests/nginx/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML syntax
        run: |
          pip install yamllint
          yamllint -d relaxed manifests/nginx/
